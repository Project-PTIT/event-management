<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách Nghệ sĩ - Event Tickets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .artist-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: none;
      border-radius: 1rem;
      overflow: hidden;
    }
    .artist-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12) !important;
    }
    .artist-img-wrapper {
      position: relative;
      padding-top: 100%;
      overflow: hidden;
      background-color: #f1f3f5;
    }
    .artist-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .artist-card:hover .artist-img {
      transform: scale(1.06);
    }
    .bg-gradient-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #fff;
    }
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100" data-ev-page>

  <header id="ev-header"></header>

  <!-- Banner Header -->
  <header class="bg-gradient-header py-5 text-center shadow-inner">
    <div class="container">
      <h1 class="display-5 fw-bold mb-2">Gặp Gỡ Các Nghệ Sĩ</h1>
      <p class="lead text-light opacity-75 mb-4">Các ca sĩ, DJ, nhạc sĩ và nghệ nhân tài năng đồng hành cùng những sự kiện bùng nổ</p>
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="input-group shadow-sm">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
            <input type="text" id="artistSearchInput" class="form-control border-start-0 py-2" placeholder="Tìm kiếm tên nghệ sĩ, thể loại...">
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container my-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h2 class="h4 mb-0 fw-bold text-dark">
        Tất cả Nghệ sĩ (<span id="artistCount">0</span>)
      </h2>
      <span class="text-muted small">Cập nhật liên tục</span>
    </div>

    <!-- Alert Message -->
    <div id="artistMessage"></div>

    <!-- Artists Grid -->
    <div id="artistsContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <div class="col w-100 text-center py-5 text-muted">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p>Đang tải danh sách nghệ sĩ...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer id="ev-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/public-utils.js"></script>
  <script src="/js/artists.js"></script>
</body>
</html>
