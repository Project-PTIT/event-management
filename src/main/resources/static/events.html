<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khám phá Sự kiện - Event Tickets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100" data-ev-page>

  <header id="ev-header"></header>

  <!-- Banner tiêu đề -->
  <section class="ev-page-hero">
    <div class="container">
      <h1>Khám phá sự kiện</h1>
      <p>Tìm kiếm và lọc các sự kiện đã được kiểm duyệt chính thức</p>
    </div>
  </section>

  <main class="container ev-search-main pb-4 flex-grow-1">

    <!-- Thanh tìm kiếm và bộ lọc -->
    <form id="eventFilterForm" class="ev-search-panel" novalidate>
      <div class="ev-search-row">
        <div class="ev-search-input">
          <i class="bi bi-search"></i>
          <input type="search" id="filterKeyword" placeholder="Tìm theo tên sự kiện hoặc mô tả..." autocomplete="off">
        </div>
        <button type="button" id="btnToggleFilters" class="ev-filter-toggle" aria-expanded="false" aria-controls="advFilters">
          <i class="bi bi-sliders"></i> Bộ lọc <span id="filterCount" class="ev-count d-none">0</span>
        </button>
        <button type="submit" class="ev-btn ev-btn-primary">Tìm kiếm</button>
      </div>

      <!-- Chu kỳ tổ chức (đồng bộ với ô chọn ẩn bên dưới) -->
      <div class="ev-chips" id="typeChips" role="group" aria-label="Chu kỳ tổ chức">
        <button type="button" class="ev-chip active" data-type="">Tất cả</button>
        <button type="button" class="ev-chip" data-type="NONE">Một lần</button>
        <button type="button" class="ev-chip" data-type="WEEKLY">Hàng tuần</button>
        <button type="button" class="ev-chip" data-type="MONTHLY">Hàng tháng</button>
        <button type="button" class="ev-chip" data-type="YEARLY">Hàng năm</button>
      </div>
      <select id="filterCreateType" class="d-none" tabindex="-1" aria-hidden="true">
        <option value="">Tất cả</option>
        <option value="NONE">Một lần</option>
        <option value="WEEKLY">Hàng tuần</option>
        <option value="MONTHLY">Hàng tháng</option>
        <option value="YEARLY">Hàng năm</option>
      </select>

      <!-- Bộ lọc nâng cao -->
      <div class="ev-adv" id="advFilters" hidden>
        <div>
          <label for="filterProvince">Tỉnh / Thành phố</label>
          <select id="filterProvince"><option value="">Tất cả tỉnh/thành</option></select>
        </div>
        <div>
          <label for="filterWard">Phường</label>
          <select id="filterWard"><option value="">Tất cả phường</option></select>
        </div>
        <div>
          <label for="filterFromDate">Từ ngày</label>
          <input type="date" id="filterFromDate">
        </div>
        <div>
          <label for="filterToDate">Đến ngày</label>
          <input type="date" id="filterToDate">
        </div>
        <button type="button" id="btnResetFilter" class="ev-link-btn"><i class="bi bi-arrow-counterclockwise me-1"></i>Đặt lại bộ lọc</button>
      </div>
    </form>

    <!-- Kết quả -->
    <div class="ev-results-bar">
      <div class="ev-results-count">Tìm thấy <strong id="totalEventsFound">0</strong> sự kiện</div>
      <div id="activeFilters" class="ev-active"></div>
    </div>

    <!-- Events Grid -->
    <div id="eventsGrid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5">
      <div class="col w-100 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>

    <!-- Pagination -->
    <nav id="paginationNav" class="d-flex justify-content-center" aria-label="Phân trang">
      <ul id="paginationList" class="pagination"></ul>
    </nav>

  </main>

  <!-- Footer -->
  <footer id="ev-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/public-utils.js"></script>
  <script src="/js/events.js"></script>
</body>
</html>
