<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý đơn hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-ev-page data-ev-roles="ROLE_ADMIN">
  <header id="ev-header"></header>

  <main class="container my-4">
    <h1 class="h3 mb-3">Quản lý đơn hàng</h1>
    <div id="message"></div>

    <div class="mb-3" style="max-width:260px">
      <select id="statusFilter" class="form-select">
        <option value="">Tất cả trạng thái</option>
        <option>Chờ thanh toán</option>
        <option>Đã thanh toán</option>
        <option>Đã hủy</option>
        <option>Chờ hoàn tiền</option>
        <option>Đã hoàn tiền</option>
      </select>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th><th>Yêu cầu hoàn tiền</th><th></th></tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </main>

  <footer id="ev-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/order-utils.js"></script>
  <script src="/js/admin-orders.js"></script>
</body>
</html>
