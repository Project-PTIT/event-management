<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duyệt sự kiện</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-ev-page data-ev-roles="ROLE_ADMIN">
  <header id="ev-header"></header>

  <main class="container my-4">
    <h1 class="h3 mb-3">Duyệt sự kiện</h1>
    <div id="message"></div>

    <ul class="nav nav-tabs mb-3" id="statusTabs">
      <li class="nav-item"><a class="nav-link active" href="#" data-status="PENDING">Chờ duyệt</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-status="APPROVED">Đã duyệt</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-status="REJECTED">Đã từ chối</a></li>
    </ul>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr><th>Mã</th><th>Tên sự kiện</th><th>Nhà tổ chức</th><th>Chu kỳ</th><th>Trạng thái</th><th></th></tr>
        </thead>
        <tbody id="eventsBody"></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="eventModalTitle">Chi tiết sự kiện</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body" id="eventModalBody"></div>
      </div>
    </div>
  </div>

  <footer id="ev-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/order-utils.js"></script>
  <script src="/js/admin-events.js"></script>
</body>
</html>
